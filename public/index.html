<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chattie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #7c7ba0; --coral: #f68f89; --page: #fde9e7;
      --bubble: #efeff4; --text: #3b3a4a; --muted: #9a9aa8; --line: #eeeef3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Poppins", Arial, sans-serif; color: var(--text); background: var(--page); }
    button { font-family: inherit; }

    #app { display: flex; height: 100vh; height: 100dvh; background: var(--purple); }
    @media (min-width: 701px) {
      #app {
        max-width: 1100px; height: calc(100vh - 40px); height: calc(100dvh - 40px);
        margin: 20px auto; border-radius: 28px; overflow: hidden;
        box-shadow: 0 12px 40px rgba(90, 80, 130, 0.25);
      }
    }

    /* ---------- Left side: chat list ---------- */
    #sidebar { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; position: relative; min-height: 0; }
    .top { padding: 18px 18px 14px; color: #fff; }
    .top-row { display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: "Pacifico", cursive; font-size: 28px; }
    .me-box { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .pill-btn { background: rgba(255, 255, 255, 0.2); color: #fff; border: none; border-radius: 14px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    .tabs { display: flex; gap: 8px; margin-top: 16px; }
    .tab { flex: 1; border: none; border-radius: 14px; padding: 10px; font-size: 14px; font-weight: 500; cursor: pointer; background: transparent; color: rgba(255, 255, 255, 0.85); }
    .tab.active { background: var(--coral); color: #fff; }

    .sheet { background: #fff; border-radius: 28px 28px 0 0; flex: 1; min-height: 0; }
    #listSheet { overflow-y: auto; padding: 18px 14px 90px; }
    .sec-title { font-weight: 600; font-size: 15px; margin: 6px 6px 10px; }
    .empty-hint { color: var(--muted); font-size: 13px; padding: 6px 8px 14px; }

    .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 8px; border: none; background: none; border-radius: 14px; cursor: pointer; color: inherit; }
    .row:hover { background: #f7f7fb; }
    .row.active { background: #fdeceb; }
    .av-wrap { position: relative; flex-shrink: 0; }
    .avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #5a5870; flex-shrink: 0; }
    .pres { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 50%; background: #2ecc40; border: 2px solid #fff; }
    .row-body { flex: 1; min-width: 0; }
    .row-name { font-weight: 600; font-size: 15px; }
    .row-prev { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-prev.typing-prev { color: var(--coral); }
    .row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 44px; }
    .row-time { font-size: 11px; color: var(--muted); }
    .badge { background: #e53935; color: #fff; font-size: 11px; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; display: flex; align-items: center; justify-content: center; }

    #fab { position: absolute; right: 18px; bottom: 18px; width: 54px; height: 54px; border-radius: 16px; border: none; background: var(--coral); color: #fff; font-size: 26px; box-shadow: 0 6px 16px rgba(238, 123, 117, 0.45); cursor: pointer; }

    .btn { border: none; border-radius: 12px; padding: 9px 16px; cursor: pointer; font-size: 14px; }
    .btn.primary { background: var(--coral); color: #fff; }
    .btn.light { background: #ececf2; }
    #newGroupBtn { width: 100%; margin-bottom: 12px; }
    #groupForm { margin: 0 4px 14px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: #fafafd; }
    #groupForm input[type="text"] { width: 100%; padding: 10px; font-size: 16px; font-family: inherit; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 8px; }
    .gm-label { display: block; padding: 5px 0; }
    .form-actions { display: flex; gap: 8px; margin-top: 8px; }

    /* ---------- Right side: the chat ---------- */
    #main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    #emptyMain { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 20px; }
    #emptyMain .big { font-size: 54px; }
    #chatView { display: none; flex: 1; min-height: 0; flex-direction: column; }

    #header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; color: #fff; }
    #backBtn { display: none; background: none; border: none; color: #fff; font-size: 30px; line-height: 1; cursor: pointer; padding: 0 6px 4px 0; }
    #headInfo { flex: 1; min-width: 0; }
    #title { display: block; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status { display: block; font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #delChat { display: none; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.2); border: none; border-radius: 12px; width: 38px; height: 38px; cursor: pointer; font-size: 16px; }

    .chat-sheet { display: flex; flex-direction: column; overflow: hidden; }
    #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 14px; list-style: none; margin: 0; display: flex; flex-direction: column; }
    .day { align-self: center; font-size: 12px; color: var(--muted); background: #f3f3f8; padding: 4px 12px; border-radius: 12px; margin: 10px 0; }
    .msg { display: flex; align-items: flex-end; gap: 8px; margin: 5px 0; max-width: 80%; }
    .msg.mine { align-self: flex-end; }
    .msg.theirs { align-self: flex-start; }
    .col { display: flex; flex-direction: column; min-width: 0; }
    .msg.mine .col { align-items: flex-end; }
    .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .mine .bubble { background: var(--coral); color: #fff; border-bottom-right-radius: 4px; }
    .theirs .bubble { background: var(--bubble); border-bottom-left-radius: 4px; }
    .who { font-size: 11px; font-weight: 600; opacity: 0.7; margin-bottom: 3px; }
    .media { display: block; max-width: 100%; max-height: 300px; border-radius: 10px; margin-bottom: 4px; }
    img.media { cursor: pointer; }
    .meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .tick.read { color: #1a73e8; }
    .del { background: none; border: none; cursor: pointer; opacity: 0.45; font-size: 12px; padding: 0; }
    .del:hover { opacity: 1; }
    .typing-bubble { display: flex; gap: 4px; padding: 12px 14px; }
    .typing-bubble span { width: 7px; height: 7px; border-radius: 50%; background: #b9b9c8; animation: blink 1.2s infinite; }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    #form { display: flex; align-items: center; gap: 10px; padding: 10px 14px 14px; }
    .input-pill { flex: 1; min-width: 0; display: flex; align-items: center; background: #f1f1f6; border-radius: 24px; padding: 0 8px 0 16px; }
    #input { flex: 1; min-width: 0; border: none; background: none; outline: none; padding: 12px 0; font-size: 16px; font-family: inherit; }
    #attach { background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px; }
    #sendBtn { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--coral); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; }

    /* ---------- Phones: show either the list or the chat ---------- */
    @media (max-width: 700px) {
      #sidebar { width: 100%; }
      #main { display: none; }
      #app.chat-open #sidebar { display: none; }
      #app.chat-open #main { display: flex; }
      #backBtn { display: inline-block; }
      .msg { max-width: 88%; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="top">
        <div class="top-row">
          <span class="logo">Chattie</span>
          <div class="me-box">
            <span>Hi, <b id="me"></b></span>
            <button class="pill-btn" onclick="logout()">Logout</button>
          </div>
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="chats" onclick="showTab('chats')">Chats</button>
          <button class="tab" data-tab="groups" onclick="showTab('groups')">Groups</button>
        </div>
      </div>

      <div class="sheet" id="listSheet">
        <div id="tab-chats">
          <div class="sec-title">Recent Chats</div>
          <div id="recent"></div>
          <div class="sec-title" id="allTitle">All Chats</div>
          <div id="allChats"></div>
        </div>

        <div id="tab-groups" style="display: none">
          <button class="btn primary" id="newGroupBtn" onclick="toggleGroupForm()">➕ New group</button>
          <div id="groupForm" style="display: none">
            <input type="text" id="groupName" placeholder="Group name">
            <div id="groupMembers"></div>
            <div class="form-actions">
              <button class="btn primary" onclick="createGroup()">Create</button>
              <button class="btn light" onclick="toggleGroupForm(false)">Cancel</button>
            </div>
          </div>
          <div id="groupList"></div>
        </div>
      </div>

      <button id="fab" onclick="newGroup()" title="New group">＋</button>
    </aside>

    <section id="main">
      <div id="emptyMain">
        <div class="big">💬</div>
        <p>Select a chat to start messaging</p>
      </div>

      <div id="chatView">
        <div id="header">
          <button id="backBtn" onclick="goBack()" title="Back to the chat list">‹</button>
          <div id="headAvatar"></div>
          <div id="headInfo">
            <span id="title"></span>
            <small id="status"></small>
          </div>
          <button id="delChat" onclick="deleteChat()" title="Delete chat">🗑</button>
        </div>

        <div class="sheet chat-sheet">
          <ul id="messages"></ul>
          <form id="form">
            <div class="input-pill">
              <input id="input" placeholder="Type your message..." autocomplete="off">
              <button type="button" id="attach" title="Send a photo or video">📎</button>
            </div>
            <input type="file" id="fileInput" accept="image/*,video/*" hidden>
            <button id="sendBtn" title="Send">➤</button>
          </form>
        </div>
      </div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const token = localStorage.getItem("token");
    const me = localStorage.getItem("username");
    if (!token) window.location.href = "/login.html";

    document.getElementById("me").textContent = me;

    const AI_NAME = "AI Assistant";
    let aiTyping = false;
    let lastDay = null;      // used for the "Today" date dividers

    let chat = null;         // { type: "user", id: "Ankit" } or { type: "group", id: "<groupId>" }
    let allUsers = [];       // [{ username, lastSeen }]
    let groups = [];         // [{ _id, name, members, createdBy }]
    let overview = {};       // "user:Ankit" or "group:<id>" -> { text, file, from, at, unread }
    const onlineSet = new Set();

    const socket = io({ auth: { token } });
    socket.on("connect_error", () => logout());

    const app = document.getElementById("app");
    const recentBox = document.getElementById("recent");
    const allBox = document.getElementById("allChats");
    const allTitle = document.getElementById("allTitle");
    const groupListBox = document.getElementById("groupList");
    const emptyMain = document.getElementById("emptyMain");
    const chatView = document.getElementById("chatView");
    const list = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const delChatBtn = document.getElementById("delChat");
    const attachBtn = document.getElementById("attach");
    const fileInput = document.getElementById("fileInput");

    async function api(path) {
      const res = await fetch("/api/chat" + path, {
        headers: { Authorization: "Bearer " + token },
      });
      if (res.status === 401) return logout();
      return res.json();
    }

    // ---------- Small helpers ----------
    const PALETTE = ["#f9c5c0", "#c5d5f9", "#cdeccb", "#f9e3a9", "#e3c9f2", "#bfe9e9"];

    function colorFor(name) {
      let h = 0;
      for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 997;
      return PALETTE[h % PALETTE.length];
    }

    function avatarEl(name, size, opts) {
      const el = document.createElement("div");
      el.className = "avatar";
      el.style.width = el.style.height = size + "px";
      el.style.fontSize = Math.round(size * 0.42) + "px";
      if (opts && opts.group) {
        el.textContent = "👥";
        el.style.background = "#d9e2f5";
      } else if (name === AI_NAME) {
        el.textContent = "🤖";
        el.style.background = "#dcd8f5";
      } else {
        el.textContent = name.trim().charAt(0).toUpperCase();
        el.style.background = colorFor(name);
      }
      return el;
    }

    function clock(at) {
      return new Date(at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function isSameDay(a, b) {
      return a.toDateString() === b.toDateString();
    }

    function timeLabel(at) {
      const d = new Date(at);
      const now = new Date();
      if (isSameDay(d, now)) return clock(at);
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      if (isSameDay(d, yesterday)) return "Yesterday";
      return d.toLocaleDateString([], { day: "numeric", month: "short" });
    }

    function dayLabel(d) {
      const now = new Date();
      if (isSameDay(d, now)) return "Today";
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      if (isSameDay(d, yesterday)) return "Yesterday";
      return d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    }

    function previewText(info) {
      const hasFile = info.file && info.file.url;
      const icon = hasFile ? (info.file.kind === "video" ? "🎥" : "📷") : "";
      let text = info.text || "";
      if (hasFile) text = text ? icon + " " + text : icon + (info.file.kind === "video" ? " Video" : " Photo");
      const prefix =
        info.from === me ? "You: " : info.isGroup && info.from ? info.from + ": " : "";
      return prefix + text;
    }

    function nameOf(it) {
      if (it.type === "group") {
        const g = groups.find((x) => x._id === it.id);
        return g ? g.name : "Group";
      }
      return it.id;
    }

    function idleText(it) {
      if (it.type === "group") {
        const g = groups.find((x) => x._id === it.id);
        return g ? "Members: " + g.members.join(", ") : "";
      }
      if (it.id === AI_NAME) return "Ask me anything";
      return onlineSet.has(it.id) ? "Online" : "Tap to start chatting";
    }

    function statusText(name) {
      if (name === AI_NAME) return aiTyping ? "typing…" : "Always online";
      if (onlineSet.has(name)) return "Online";
      const u = allUsers.find((x) => x.username === name);
      if (u && u.lastSeen) return "last seen " + new Date(u.lastSeen).toLocaleString();
      return "Offline";
    }

    // ---------- Chat list ----------
    function buildItems() {
      const items = [{ type: "user", id: AI_NAME }];
      allUsers.forEach((u) => items.push({ type: "user", id: u.username }));
      groups.forEach((g) => items.push({ type: "group", id: g._id }));
      items.forEach((it) => {
        it.info = overview[it.type + ":" + it.id] || null;
      });
      return items;
    }

    function rowFor(it) {
      const btn = document.createElement("button");
      const active = chat && chat.type === it.type && chat.id === it.id;
      btn.className = "row" + (active ? " active" : "");
      btn.onclick = () => (it.type === "group" ? openGroup(it.id) : openChat(it.id));

      const wrap = document.createElement("div");
      wrap.className = "av-wrap";
      wrap.appendChild(avatarEl(nameOf(it), 46, { group: it.type === "group" }));
      if (it.type === "user" && (it.id === AI_NAME || onlineSet.has(it.id))) {
        const dot = document.createElement("span");
        dot.className = "pres";
        wrap.appendChild(dot);
      }
      btn.appendChild(wrap);

      const body = document.createElement("div");
      body.className = "row-body";
      const name = document.createElement("div");
      name.className = "row-name";
      name.textContent = nameOf(it);
      const prev = document.createElement("div");
      prev.className = "row-prev";
      if (it.id === AI_NAME && aiTyping) {
        prev.textContent = "Typing...";
        prev.classList.add("typing-prev");
      } else {
        prev.textContent = it.info ? previewText(it.info) : idleText(it);
      }
      body.appendChild(name);
      body.appendChild(prev);
      btn.appendChild(body);

      const side = document.createElement("div");
      side.className = "row-side";
      if (it.info) {
        const t = document.createElement("div");
        t.className = "row-time";
        t.textContent = timeLabel(it.info.at);
        side.appendChild(t);
        if (it.info.unread > 0) {
          const b = document.createElement("div");
          b.className = "badge";
          b.textContent = it.info.unread;
          side.appendChild(b);
        }
      }
      btn.appendChild(side);
      return btn;
    }

    function fill(box, items, emptyText) {
      box.innerHTML = "";
      if (!items.length && emptyText) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = emptyText;
        box.appendChild(hint);
      }
      items.forEach((it) => box.appendChild(rowFor(it)));
    }

    function renderLists() {
      const items = buildItems();
      const byTime = (a, b) => new Date(b.info.at) - new Date(a.info.at);
      const recent = items.filter((i) => i.info).sort(byTime);
      const rest = items.filter((i) => !i.info);
      const groupItems = items
        .filter((i) => i.type === "group")
        .sort((a, b) => (b.info ? new Date(b.info.at) : 0) - (a.info ? new Date(a.info.at) : 0));

      fill(recentBox, recent, "No chats yet. Pick someone from All Chats below.");
      fill(allBox, rest);
      allTitle.style.display = rest.length ? "" : "none";
      fill(groupListBox, groupItems, "No groups yet. Tap ＋ to create one.");
      updateHeader();
    }

    function showTab(name) {
      document.getElementById("tab-chats").style.display = name === "chats" ? "" : "none";
      document.getElementById("tab-groups").style.display = name === "groups" ? "" : "none";
      document.querySelectorAll(".tab").forEach((t) => {
        t.classList.toggle("active", t.dataset.tab === name);
      });
    }

    function newGroup() {
      showTab("groups");
      toggleGroupForm(true);
    }

    async function loadUsers() {
      const data = await api("/users");
      if (!Array.isArray(data)) return;
      allUsers = data;
      renderLists();
    }

    async function loadGroups() {
      const data = await api("/groups");
      if (!Array.isArray(data)) return;
      groups = data;
      renderLists();
    }

    async function loadOverview() {
      const data = await api("/overview");
      if (!data || !Array.isArray(data.direct)) return;
      overview = {};
      data.direct.forEach((d) => (overview["user:" + d.id] = d));
      data.groups.forEach((d) => {
        d.isGroup = true;
        overview["group:" + d.id] = d;
      });
      // the chat I'm looking at has nothing unread
      if (chat && chat.type === "user" && overview["user:" + chat.id]) {
        overview["user:" + chat.id].unread = 0;
      }
      renderLists();
    }

    // ---------- Chat header ----------
    function updateHeader() {
      if (!chat) return;
      const title = document.getElementById("title");
      const status = document.getElementById("status");

      if (chat.type === "user") {
        title.textContent = chat.id;
        status.textContent = statusText(chat.id);
        delChatBtn.title = chat.id === AI_NAME ? "Clear chat" : "Delete chat";
        delChatBtn.style.display = "inline-flex";
      } else {
        const g = groups.find((x) => x._id === chat.id);
        if (!g) return;
        title.textContent = g.name;
        status.textContent = g.members.length + " members: " + g.members.join(", ");
        delChatBtn.title = "Delete group";
        // only the person who created the group can delete it
        delChatBtn.style.display = g.createdBy === me ? "inline-flex" : "none";
      }
    }

    function setHeadAvatar(name, isGroup) {
      const box = document.getElementById("headAvatar");
      box.innerHTML = "";
      box.appendChild(avatarEl(name, 40, { group: isGroup }));
    }

    // ---------- Opening and closing chats ----------
    function showChatView() {
      emptyMain.style.display = "none";
      chatView.style.display = "flex";
      app.classList.add("chat-open"); // on phones: show the chat screen
    }

    function clearMessages() {
      list.innerHTML = "";
      lastDay = null;
    }

    function closeChat() {
      chat = null;
      clearMessages();
      chatView.style.display = "none";
      emptyMain.style.display = "";
      app.classList.remove("chat-open"); // on phones: back to the list
    }

    // The ‹ button (phones only)
    function goBack() {
      closeChat();
      renderLists();
    }

    async function openChat(name) {
      const opened = { type: "user", id: name };
      chat = opened;
      showChatView();
      attachBtn.style.display = name === AI_NAME ? "none" : ""; // the AI can't see photos
      setHeadAvatar(name, false);
      clearMessages();
      if (overview["user:" + name]) overview["user:" + name].unread = 0;
      renderLists();

      const messages = await api("/messages/" + encodeURIComponent(name));
      if (chat !== opened) return; // I clicked something else meanwhile
      if (Array.isArray(messages)) messages.forEach(addMessage);
      showTyping();
      socket.emit("mark read", { from: name }); // I've now seen their messages
    }

    async function openGroup(id) {
      const opened = { type: "group", id };
      chat = opened;
      showChatView();
      attachBtn.style.display = "";
      const g = groups.find((x) => x._id === id);
      setHeadAvatar(g ? g.name : "Group", true);
      clearMessages();
      renderLists();

      const messages = await api("/groups/" + id + "/messages");
      if (chat !== opened) return;
      if (Array.isArray(messages)) messages.forEach(addMessage);
    }

    // ---------- Messages on screen ----------
    function scrollDown() {
      list.scrollTop = list.scrollHeight;
    }

    // Adds a row to the list, keeping the "typing" bubble last
    function insertRow(el) {
      list.insertBefore(el, document.getElementById("typingRow"));
    }

    function addMessage(m) {
      const when = m.createdAt || new Date().toISOString();

      // A date divider when the day changes
      const day = new Date(when).toDateString();
      if (day !== lastDay) {
        lastDay = day;
        const d = document.createElement("li");
        d.className = "day";
        d.textContent = dayLabel(new Date(when));
        insertRow(d);
      }

      const isMine = m.from === me;
      const li = document.createElement("li");
      li.className = "msg " + (isMine ? "mine" : "theirs");
      li.dataset.id = m._id;

      if (!isMine) li.appendChild(avatarEl(m.from, 28));

      const col = document.createElement("div");
      col.className = "col";
      const bubble = document.createElement("div");
      bubble.className = "bubble";

      // In groups, show who sent other people's messages
      if (m.group && !isMine) {
        const who = document.createElement("div");
        who.className = "who";
        who.textContent = m.from;
        bubble.appendChild(who);
      }

      // Photo or video
      if (m.file && m.file.url) {
        let media;
        if (m.file.kind === "video") {
          media = document.createElement("video");
          media.controls = true;
          media.preload = "metadata";
          media.onloadedmetadata = scrollDown;
        } else {
          media = document.createElement("img");
          media.loading = "lazy";
          media.onload = scrollDown;
          media.onclick = () => window.open(m.file.url, "_blank");
        }
        media.className = "media";
        media.src = m.file.url;
        bubble.appendChild(media);
      }

      if (m.text) {
        const t = document.createElement("span");
        t.textContent = m.text;
        bubble.appendChild(t);
      }
      col.appendChild(bubble);

      // Under the bubble: time, read ticks and the delete button
      const meta = document.createElement("div");
      meta.className = "meta";
      const time = document.createElement("span");
      time.textContent = clock(when);
      meta.appendChild(time);

      if (isMine) {
        if (!m.group) {
          const tick = document.createElement("span");
          tick.className = "tick" + (m.read ? " read" : "");
          tick.textContent = m.read ? "✓✓" : "✓";
          meta.appendChild(tick);
        }
        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "🗑";
        del.title = "Delete message";
        del.onclick = () => {
          if (confirm("Delete this message for everyone?")) {
            socket.emit("delete message", { id: m._id });
          }
        };
        meta.appendChild(del);
      }
      col.appendChild(meta);
      li.appendChild(col);

      insertRow(li);
      scrollDown();
    }

    // The three bouncing dots while the AI is writing an answer
    function showTyping() {
      const old = document.getElementById("typingRow");
      if (old) old.remove();
      if (!aiTyping || !chat || chat.type !== "user" || chat.id !== AI_NAME) return;

      const li = document.createElement("li");
      li.id = "typingRow";
      li.className = "msg theirs";
      li.appendChild(avatarEl(AI_NAME, 28));
      const col = document.createElement("div");
      col.className = "col";
      const bubble = document.createElement("div");
      bubble.className = "bubble typing-bubble";
      bubble.innerHTML = "<span></span><span></span><span></span>";
      col.appendChild(bubble);
      li.appendChild(col);
      list.appendChild(li);
      scrollDown();
    }

    function deleteChat() {
      if (!chat) return;
      if (chat.type === "user") {
        const question =
          chat.id === AI_NAME
            ? "Clear your whole conversation with the AI Assistant?"
            : "Delete the whole chat with " + chat.id + "? This removes it for both of you.";
        if (confirm(question)) socket.emit("delete chat", { user: chat.id });
      } else {
        if (confirm("Delete this group and all its messages for everyone?")) {
          socket.emit("delete group", { groupId: chat.id });
        }
      }
    }

    // ---------- New group form ----------
    function toggleGroupForm(forceOpen) {
      const box = document.getElementById("groupForm");
      const opening = forceOpen === undefined ? box.style.display === "none" : forceOpen;
      box.style.display = opening ? "block" : "none";
      if (!opening) return;

      const members = document.getElementById("groupMembers");
      members.innerHTML = "";
      allUsers.forEach((u) => {
        const label = document.createElement("label");
        label.className = "gm-label";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = u.username;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(" " + u.username));
        members.appendChild(label);
      });
    }

    function createGroup() {
      const nameBox = document.getElementById("groupName");
      const name = nameBox.value.trim();
      const members = [...document.querySelectorAll("#groupMembers input:checked")].map(
        (c) => c.value
      );
      if (!name) return alert("Enter a group name");
      if (members.length < 1) return alert("Pick at least one member");

      socket.emit("create group", { name, members });
      nameBox.value = "";
      toggleGroupForm(false);
    }

    // ---------- Sending messages ----------
    function sendTo(target, text, file) {
      if (target.type === "user") {
        socket.emit("private message", { to: target.id, text, file });
      } else {
        socket.emit("group message", { groupId: target.id, text, file });
      }
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      if (!input.value.trim() || !chat) return;
      sendTo(chat, input.value);
      input.value = "";
    };

    // Sending a photo or video (what you typed becomes the caption)
    attachBtn.onclick = () => {
      if (chat) fileInput.click();
    };

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      fileInput.value = "";
      if (!file || !chat) return;
      if (file.size > 25 * 1024 * 1024) return alert("File too big (max 25 MB)");

      const target = chat; // remember where it should go, even if I switch chats
      const data = new FormData();
      data.append("file", file);

      attachBtn.disabled = true;
      attachBtn.textContent = "⏳";
      try {
        const res = await fetch("/api/chat/upload", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: data,
        });
        if (res.status === 401) return logout();
        const result = await res.json();
        if (!res.ok) return alert(result.error || "Upload failed");

        sendTo(target, input.value, { url: result.url });
        input.value = "";
      } catch (err) {
        alert("Upload failed. Please try again.");
      } finally {
        attachBtn.disabled = false;
        attachBtn.textContent = "📎";
      }
    };

    // ---------- Things the server tells us ----------
    socket.on("private message", (m) => {
      const other = m.from === me ? m.to : m.from;
      const open = chat && chat.type === "user" && chat.id === other;

      // Update the chat list (last message and unread badge)
      const prev = overview["user:" + other];
      let unread = (prev && prev.unread) || 0;
      if (open) unread = 0;
      else if (m.to === me) unread += 1;
      overview["user:" + other] = {
        id: other, text: m.text, file: m.file, from: m.from,
        at: m.createdAt, unread, isGroup: false,
      };

      if (open) {
        addMessage(m);
        // A message arrived in the chat I'm looking at: it's read right away
        if (m.from === other && m.to === me) socket.emit("mark read", { from: other });
      }
      renderLists();
    });

    socket.on("group message", (m) => {
      overview["group:" + m.group] = {
        id: m.group, text: m.text, file: m.file, from: m.from,
        at: m.createdAt, unread: 0, isGroup: true,
      };
      if (chat && chat.type === "group" && chat.id === m.group) addMessage(m);
      renderLists();
    });

    // The AI is working on an answer
    socket.on("ai typing", ({ typing }) => {
      aiTyping = typing;
      showTyping();
      updateHeader();
      renderLists();
    });

    // A message was deleted: remove it from the screen
    socket.on("message deleted", ({ id }) => {
      const li = document.querySelector('#messages li[data-id="' + id + '"]');
      if (li) li.remove();
      loadOverview(); // the "last message" in the list may have changed
    });

    // A whole one-to-one chat was deleted
    socket.on("chat deleted", ({ a, b }) => {
      const other = a === me ? b : a;
      delete overview["user:" + other];
      if (chat && chat.type === "user" && chat.id === other) clearMessages();
      renderLists();
    });

    // A group was created and I'm a member
    socket.on("group created", (g) => {
      if (!groups.find((x) => x._id === g._id)) groups.push(g);
      renderLists();
      if (g.createdBy === me) openGroup(g._id); // open it for the creator
    });

    // A group was deleted
    socket.on("group deleted", ({ groupId }) => {
      groups = groups.filter((g) => g._id !== groupId);
      delete overview["group:" + groupId];
      if (chat && chat.type === "group" && chat.id === groupId) closeChat();
      renderLists();
    });

    // The other person read my messages: turn all my ticks blue
    socket.on("messages read", ({ by }) => {
      if (!chat || chat.type !== "user" || by !== chat.id) return;
      document.querySelectorAll("#messages .tick").forEach((t) => {
        t.textContent = "✓✓";
        t.classList.add("read");
      });
    });

    // Who is online right now (sent once when I connect)
    socket.on("online users", (names) => {
      onlineSet.clear();
      names.forEach((n) => onlineSet.add(n));
      renderLists();
    });

    // Someone came online or went offline
    socket.on("presence", (p) => {
      if (p.online) {
        onlineSet.add(p.username);
      } else {
        onlineSet.delete(p.username);
        const u = allUsers.find((x) => x.username === p.username);
        if (u) u.lastSeen = p.lastSeen;
      }
      renderLists();
    });

    function logout() {
      localStorage.clear();
      window.location.href = "/login.html";
    }

    // ---------- Start ----------
    renderLists(); // shows the AI Assistant right away
    loadUsers();
    loadGroups();
    loadOverview();
    setInterval(loadUsers, 10000); // picks up newly signed-up users
  </script>
</body>
</html>
